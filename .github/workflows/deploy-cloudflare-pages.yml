name: Publish LXDB demo for Cloudflare Workers

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-workers-lxdb
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Legacy environment holds the private submodule read token; this job does not deploy to GitHub Pages.
    environment:
      name: github-pages
    env:
      NEXT_PUBLIC_SITE_URL: https://lxdb.captain-solution.tech/
      SEO_INDEXABLE: "false"
      DEPLOY_TARGET: demo

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout pinned private submodules
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.COMPONENT_UI_READ_TOKEN || secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUBMODULE_READ_TOKEN" ]; then
            echo "::error::Missing COMPONENT_UI_READ_TOKEN (or SUBMODULE_READ_TOKEN) in github-pages environment / repository secrets."
            exit 1
          fi
          git -c "url.https://x-access-token:$SUBMODULE_READ_TOKEN@github.com/.insteadOf=https://github.com/" submodule update --init --recursive --depth=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build root-domain static demo
        run: npm run build:demo

      - name: Validate export and route prefixes
        run: |
          set -euo pipefail
          npm run test:export
          test -f out/index.html
          test -d out/_next
          test -f out/robots.txt
          ! grep -q '/solar_demo/' out/index.html

      # Workers Builds watches the prebuilt cf-pages branch.
      # This uses the gh-pages action as a generic Git branch publisher; GitHub Pages hosting is disabled.
      # No Cloudflare API token or private source repository is sent to Cloudflare.
      - name: Publish assets to Workers build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cf-pages
          publish_dir: ./out
          force_orphan: true
          commit_message: "deploy(lxdb): static site from dev"

      # Pushes made with GITHUB_TOKEN may not trigger Workers Builds Git webhooks.
      # Use a secret deploy hook to explicitly start the Worker build after publish.
      - name: Trigger Cloudflare Workers build
        env:
          WORKER_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$WORKER_DEPLOY_HOOK" ]; then
            echo "::warning::Missing CLOUDFLARE_WORKERS_DEPLOY_HOOK. Build artifacts were published, but Workers auto-deploy may not run. Add the hook URL in the github-pages environment's Actions secrets."
            exit 0
          fi
          curl --fail-with-body --retry 3 --retry-delay 2 --silent --show-error --request POST "$WORKER_DEPLOY_HOOK"
