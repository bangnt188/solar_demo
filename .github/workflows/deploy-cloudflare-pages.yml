name: Publish LXDB demo to Cloudflare Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-lxdb
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      NEXT_PUBLIC_SITE_URL: https://lxdb.captain-solution.tech/
      SEO_INDEXABLE: "false"
      DEPLOY_TARGET: demo

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout pinned private submodules
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.COMPONENT_UI_READ_TOKEN || secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUBMODULE_READ_TOKEN" ]; then
            echo "::error::Missing COMPONENT_UI_READ_TOKEN (or SUBMODULE_READ_TOKEN) in github-pages environment / repository secrets."
            exit 1
          fi
          git -c "url.https://x-access-token:$SUBMODULE_READ_TOKEN@github.com/.insteadOf=https://github.com/" submodule update --init --recursive --depth=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build root-domain static demo
        run: npm run build:demo

      - name: Validate export and route prefixes
        run: |
          set -euo pipefail
          npm run test:export
          test -f out/index.html
          test -d out/_next
          test -f out/robots.txt
          ! grep -q '/solar_demo/' out/index.html

      # Cloudflare Pages is Git-integrated to this prebuilt, submodule-free
      # branch. No Cloudflare API token or private source is sent to Cloudflare.
      - name: Publish to Cloudflare deployment branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cf-pages
          publish_dir: ./out
          force_orphan: true
          commit_message: "deploy(lxdb): static site from dev"
