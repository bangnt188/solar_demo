name: Deploy demo to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://bangnt188.github.io/solar_demo/
      SEO_INDEXABLE: "false"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Fetch pinned private submodules
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.COMPONENT_UI_READ_TOKEN || secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUBMODULE_READ_TOKEN" ]; then
            echo "::error::Configure Environment secret COMPONENT_UI_READ_TOKEN (or SUBMODULE_READ_TOKEN) in github-pages. Contents: Read is needed on component-ui and lib-ts-be."
            exit 1
          fi
          git -c "url.https://x-access-token:$SUBMODULE_READ_TOKEN@github.com/.insteadOf=https://github.com/" submodule update --init --recursive --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static demo
        run: npm run build:demo

      - name: Verify export
        run: npm run test:export

      - name: Validate Pages artifact
        run: |
          test -f out/index.html
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
