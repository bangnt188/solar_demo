name: Deploy demo to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://bangnt188.github.io/solar_demo/
      SEO_INDEXABLE: "false"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout app + private UI submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENT_UI_READ_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:demo
      - run: npm run test:export
      - run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
